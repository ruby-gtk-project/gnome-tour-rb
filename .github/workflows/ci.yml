# Upstream's GitLab CI builds a Flatpak and checks formatting with rustfmt.
# The equivalents here are the nix build — which also merges the translations
# into the desktop entry and metainfo and validates both — and `rake`, which
# runs the checks and rubocop.
name: CI

permissions:
  contents: read

on:
  push:
    branches: [ruby]
  pull_request:
    branches: [ruby]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Build
        run: nix build --print-build-logs

      - name: Build the development profile
        run: nix build .#devel --print-build-logs

      # GTK4 renders to an offscreen surface, so the UI checks and their
      # screenshots need no display server and no Xvfb.
      - name: Checks and lint
        run: nix develop --command rake

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: tmp/shots
          if-no-files-found: warn
